<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ご要望のヒアリング｜ShopiLab</title>
<style>
:root{--navy:#1a3a5c;--line:#dde3ea;--bg:#f4f6f9;--ink:#1a1a1a;--sub:#5b6773}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:12px 16px;flex-shrink:0}
header .t{font-size:15px;font-weight:600}
header .s{font-size:11.5px;opacity:.8;margin-top:2px}
.bar{height:3px;background:rgba(255,255,255,.22);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7fb2e5;transition:width .4s ease}
.mascot{display:none;position:fixed;right:12px;bottom:150px;
  flex-direction:row-reverse;align-items:center;gap:8px;max-width:calc(100vw - 24px);
  z-index:50;pointer-events:none}
.mascot-face{flex-shrink:0;width:110px;position:relative}
.mascot-sprite{display:block;width:100%;aspect-ratio:192/208;transform-origin:50% 100%;
  background:url("sprite.webp") no-repeat;background-size:800% 1100%}
.mascot-sprite.mbow{animation:mbow .6s ease-in-out}
.mascot-think{position:absolute;top:-4px;right:-6px;font-size:19px;font-weight:800;
  color:#4a7fc9;text-shadow:0 1px 2px rgba(0,0,0,.15);opacity:0;pointer-events:none}
.mascot.thinking .mascot-think{opacity:1;animation:mthink 1.6s ease-in-out infinite}
.mascot-bubble{position:relative;background:#fff;border:1px solid #c3d0dc;border-radius:14px;
  padding:6px 12px;font-size:13px;color:#2f4a63;font-weight:600;line-height:1.5;
  max-width:min(52vw,220px);animation:mpop .32s ease-out}
.mascot-bubble:before{content:"";position:absolute;right:-6px;top:10px;width:0;height:0;
  border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:6px solid #fff}
@keyframes mpop{
  0%{transform:scale(.85);opacity:0}
  100%{transform:scale(1);opacity:1}
}
@keyframes mbow{
  0%{transform:translateY(0) scaleY(1)}
  40%{transform:translateY(9%) scaleY(.9)}
  60%{transform:translateY(9%) scaleY(.9)}
  100%{transform:translateY(0) scaleY(1)}
}
@keyframes mthink{
  0%,100%{transform:translateY(0);opacity:.85}
  50%{transform:translateY(-5px);opacity:1}
}
@media (max-width:480px){
  .mascot{right:8px}
  .mascot-face{width:54px}
  .mascot-bubble{font-size:12.5px;display:none}
  .mascot.show-bubble .mascot-bubble{display:block}
  .mascot-think{font-size:15px;top:-3px;right:-4px}
}
@media (prefers-reduced-motion:reduce){
  .mascot-bubble{animation:none}
  .mascot-sprite.mbow{animation:none}
  .mascot.thinking .mascot-think{animation:none;opacity:1}
}
main{flex:1;overflow-y:auto;padding:18px 14px 8px;-webkit-overflow-scrolling:touch}
.wrap{max-width:680px;margin:0 auto}
.row{display:flex;margin-bottom:14px}
.row.me{justify-content:flex-end}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word}
.row.ai .msg{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.row.me .msg{background:var(--navy);color:#fff;border-top-right-radius:4px}
.msg b{font-weight:600}
.hint{max-width:82%;margin:-8px 0 14px;padding:9px 12px;background:#eef3f8;
  border-left:3px solid #9fbcd6;border-radius:0 8px 8px 0;font-size:12.5px;
  line-height:1.7;color:#3d4d5c;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;align-items:center}
.cap{flex-basis:100%;font-size:11.5px;color:#8b97a3;margin-bottom:-2px}
.chip{background:#fff;border:1.4px solid #c3d0dc;color:var(--navy);border-radius:18px;
  padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;line-height:1.4}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.go{background:#2f6a3f;color:#fff;border-color:#2f6a3f;font-weight:600}
.chip.sk{border-style:dashed;color:var(--sub)}
.dots{display:inline-flex;gap:4px;padding:13px 15px;background:#fff;
  border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#a8b6c4;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
footer{flex-shrink:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.f{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:1.4px solid #ccd6e0;border-radius:12px;padding:10px 13px;
  font-size:16px;font-family:inherit;resize:none;max-height:130px;line-height:1.6;outline:none}
textarea:focus{border-color:var(--navy)}
button.send{background:var(--navy);color:#fff;border:0;border-radius:12px;
  padding:0 18px;height:43px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
button.send:disabled{background:#aab6c2;cursor:default}
button.attach{background:#fff;border:1.4px solid #ccd6e0;color:var(--navy);border-radius:12px;
  width:43px;height:43px;font-size:17px;cursor:pointer;font-family:inherit;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
button.attach:disabled{opacity:.5;cursor:default}
.preview{max-width:680px;margin:0 auto 8px;display:none;align-items:center;gap:9px;
  background:#eef3f8;border:1px solid #c3d0dc;border-radius:10px;padding:6px 10px;font-size:12.5px;color:#3d4d5c}
.preview img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex-shrink:0}
.preview .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview button{background:none;border:0;color:#8a3a3a;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;padding:2px 4px}
.msg img{max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
.note{max-width:680px;margin:7px auto 0;font-size:11px;color:#8b97a3;text-align:center}
.exit-row{max-width:680px;margin:10px auto 0;text-align:center}
.exitlink{background:#fff;border:1.4px solid #ccd6e0;color:#5b6773;border-radius:18px;
  padding:8px 18px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;line-height:1.4}
.exitlink:active{transform:scale(.97)}
.chip.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.end{background:#fff;border:1px solid var(--line);border-left:4px solid #2f6a3f;
  border-radius:8px;padding:16px;font-size:14px;line-height:1.85;margin-bottom:14px}
.err{background:#fdf2f2;border:1px solid #e5c3c3;color:#8a3a3a;border-radius:8px;
  padding:11px 13px;font-size:13px;line-height:1.7;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="t">ご要望のヒアリング</div>
  <div class="s">ShopiLab（運営：株式会社セルフプラス／協力：ウェブ・コロ株式会社）｜所要 10〜15分・入力内容は自動で保存されます</div>
  <div class="bar"><i id="pg"></i></div>
</header>
<!-- クマイ（KumAI）のマスコット。sprite.webp（8列×11行のスプライトシート、
     index.htmlと同じ場所に配置）を mascot-sprite の背景に敷き、JSでコマ送りする。
     1枚のHTMLという方針は保つが、スプライトはbase64化すると巨大になるため
     この画像だけは相対URLで読み込む -->
<div class="mascot" id="mascot" style="display:none">
  <span class="mascot-face"><span class="mascot-sprite" id="mascotSprite"></span><span class="mascot-think" aria-hidden="true">？</span></span>
  <span class="mascot-bubble" id="mascotText"></span>
</div>
<main id="main"><div class="wrap" id="log"></div></main>
<footer>
  <div class="preview" id="preview">
    <img id="previewImg" alt="">
    <div class="name" id="previewName"></div>
    <button type="button" id="previewRemove" aria-label="添付を取り消す">×</button>
  </div>
  <div class="f">
    <button type="button" class="attach" id="attach" title="画像・資料を添付">📎</button>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
    <textarea id="ta" rows="1" placeholder="ここに入力してください" enterkeyhint="send"></textarea>
    <button class="send" id="send">送信</button>
  </div>
  <div class="note">分からない質問は「わからない」と送っていただければ、ご説明します。</div>
  <div class="note">既存サイトの画面キャプチャや資料の画像があれば、📎から添付すると読み取ります。</div>
  <div class="exit-row"><button type="button" id="exitlink" class="exitlink">✕ ここで終了する</button></div>
</footer>

<script>window.HEARING_API='https://llmudxrkjgangrzznhuq.supabase.co/functions/v1/hearing';</script>
<script>
(function(){
  // WordPress など別ドメインに置くときは window.HEARING_API に関数のURLを入れる。
  // Supabase の標準ドメインは text/html を text/plain に書き換えるため、
  // この画面は shopi-lab.com 側に置いて配信する（APIだけ Supabase を呼ぶ）
  var API = (window.HEARING_API || location.pathname).replace(/\/+$/,"");
  // iframe(srcdoc) の中では location.search が空になる。親ページが
  // この行の null を書き換えて ?ref= などを引き継ぐ（hearing_publish_page.py）
  window.HEARING_QS=null;
  var QS = (typeof window.HEARING_QS === "string")
    ? window.HEARING_QS : location.search.replace(/^\?/, "");
  var log = document.getElementById("log"), main = document.getElementById("main");
  var ta = document.getElementById("ta"), send = document.getElementById("send");
  var pg = document.getElementById("pg"), exitlink = document.getElementById("exitlink");
  var attachBtn = document.getElementById("attach"), fileInput = document.getElementById("file");
  var preview = document.getElementById("preview"), previewImg = document.getElementById("previewImg"),
    previewName = document.getElementById("previewName"), previewRemove = document.getElementById("previewRemove");
  var mascot = document.getElementById("mascot"), mascotText = document.getElementById("mascotText");
  var token = null, busy = false, multi = [], done = false;
  var greeted = false;   // 最初の質問だけ「こんにちは」と手を振る
  var bubbleTimer;   // スマホの吹き出しを数秒で自動的に閉じるタイマー
  var pendingImage = null;   // {mime, data(base64本体), dataUrl, name}
  var IMAGE_MAX_BYTES = 9 * 1024 * 1024;   // サーバ側 IMAGE_MAX_BASE64 とおよそ対応
  exitlink.style.display = "none";   // 最初の応答（照合の案内）が来るまでは隠す

  function scroll(){ main.scrollTop = main.scrollHeight; }

  // マスコットの縦位置は固定pxではなく、実際のフッター（composer）の高さに
  // 追従させる。フッターにはヘルパー行やセーフエリアの余白が含まれ、
  // 画面幅やテキストエリアの伸びで高さが変わるため、JSを唯一の正とする
  function placeMascot(){
    var f = document.querySelector("footer");
    if (f && mascot){ mascot.style.bottom = (f.offsetHeight + 10) + "px"; }
  }
  window.addEventListener("resize", placeMascot);
  window.addEventListener("orientationchange", placeMascot);

  // クマイ（KumAI）のスプライトシート再生。sprite.webp は8列×11行、
  // コマ比率192/208。行=状態、列=コマ。.mascot-sprite に
  // background-size:800% 1100% を敷いてあるので、backgroundPosition を
  // 列/(8-1)・行/(11-1) の割合で動かせば1コマぶんだけ見える
  var mascotSprite = document.getElementById("mascotSprite");
  var SPRITE_COLS = 8, SPRITE_ROWS = 11;
  var REDUCED_MOTION = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  // pingpong: 0→末尾→0 と往復させる。ループ状態（idle/waiting）ではそのまま
  // 回り続ける。ワンショット状態に付けると、cycles回数だけ往復してコマ0
  // （＝ニュートラルな姿勢）に戻ってからidleへ引き継ぐので、上げた腕が
  // 下ろされないままidleに切り替わってカクッと戻る、という不自然なスナップが
  // 起きない（既定 cycles:1。省略時は通常のワンショット順再生のまま）。
  // waving（腕を上げる→下ろす）とjumping（着地の瞬間で終わらせたい。
  // 最終コマがまだ空中姿勢なので、素の順再生だと着地せずidleへスナップする）
  // に付けた。failedは最終コマが既に落ち着いた表情なので付けていない
  var STATES = {
    idle:    { row: 0,  frames: 7, fps: 4,  loop: true,  pingpong: true },
    waving:  { row: 3,  frames: 4, fps: 5,  loop: false, pingpong: true, cycles: 2 },
    waiting: { row: 6,  frames: 6, fps: 5,  loop: true,  pingpong: true },
    jumping: { row: 4,  frames: 5, fps: 9,  loop: false, pingpong: true },
    review:  { row: 8,  frames: 6, fps: 5,  loop: true  },
    failed:  { row: 5,  frames: 8, fps: 6,  loop: false },
    // look1/look2 は使っていないが、スプライト側に存在するので定義だけ残す
    // （2026-08-07 ユーザー指示：待機中に勝手に見回す・手を振るのが不自然との
    // ことで、アイドルブレイクの自動発火はやめた。idleはずっと呼吸ループのまま）
    look1:   { row: 9,  frames: 8, fps: 4,  loop: false },
    look2:   { row: 10, frames: 8, fps: 4,  loop: false },
  };
  var spriteTimer = null;

  function drawSpriteFrame(row, col){
    if (!mascotSprite) return;
    mascotSprite.style.backgroundPosition =
      (col / (SPRITE_COLS - 1) * 100) + "% " + (row / (SPRITE_ROWS - 1) * 100) + "%";
  }

  // 回答を送るたびの「ありがとう」の会釈。スプライトにお辞儀のコマが無いので、
  // JSのコマ送り（background-position）とは別レイヤーのCSSトランスフォームで
  // 表現する。クラスを外してリフローを挟んでから付け直すことで、毎回頭から
  // 再生させる。reduced-motionでは何もしない
  if (mascotSprite){
    mascotSprite.addEventListener("animationend", function(e){
      if (e.animationName === "mbow") mascotSprite.classList.remove("mbow");
    });
  }
  function playBow(){
    if (!mascotSprite || REDUCED_MOTION) return;
    mascotSprite.classList.remove("mbow");
    void mascotSprite.offsetWidth;
    mascotSprite.classList.add("mbow");
  }

  // 状態を切り替える。ループ状態はそのまま回り続け（pingpongなら0→末尾→0と
  // 往復し）、ワンショット状態は最後のコマまで再生してから自動的に idle へ
  // 戻る（そのとき idle のコマ0から綺麗に再開する）。前のタイマーは必ず
  // 止めてから次を始める（二重に走って早回しになるのを防ぐ）
  function setSprite(name){
    var st = STATES[name] || STATES.idle;
    if (spriteTimer){ clearInterval(spriteTimer); spriteTimer = null; }
    if (!mascotSprite) return;
    if (REDUCED_MOTION){
      drawSpriteFrame(st.row, 0);   // 動かさず、その状態の最初のコマだけ静止表示する
      return;
    }
    var frame = 0, dir = 1, bounces = 0;
    drawSpriteFrame(st.row, frame);
    spriteTimer = setInterval(function(){
      if (st.pingpong){
        frame += dir;
        if (frame >= st.frames - 1){
          frame = st.frames - 1; dir = -1;
        } else if (frame <= 0){
          frame = 0; dir = 1; bounces++;
          // ワンショットのピンポンは、指定回数だけ往復してコマ0
          // （ニュートラルな姿勢）に戻ったところで終える
          if (!st.loop && bounces >= (st.cycles || 1)){
            clearInterval(spriteTimer); spriteTimer = null;
            setSprite("idle");
            return;
          }
        }
      } else {
        frame++;
        if (frame >= st.frames){
          if (st.loop){
            frame = 0;
          } else {
            clearInterval(spriteTimer); spriteTimer = null;
            setSprite("idle");
            return;
          }
        }
      }
      drawSpriteFrame(st.row, frame);
    }, Math.round(1000 / st.fps));
  }
  setSprite("idle");   // マスコットが最初に表示される時点の初期状態

  function bubble(who, text, imageUrl){
    var r = document.createElement("div");
    r.className = "row " + who;
    var m = document.createElement("div");
    m.className = "msg";
    if (imageUrl){
      var img = document.createElement("img");
      img.src = imageUrl; img.alt = "添付画像";
      m.appendChild(img);
    }
    // **強調** だけ簡易に太字へ。それ以外はテキストとして扱う
    var parts = String(text).split(/\*\*(.+?)\*\*/g);
    for (var i = 0; i < parts.length; i++){
      if (i % 2 === 1){ var b = document.createElement("b"); b.textContent = parts[i]; m.appendChild(b); }
      else if (parts[i]) m.appendChild(document.createTextNode(parts[i]));
    }
    r.appendChild(m); log.appendChild(r); scroll();
  }

  function clearAttachment(){
    pendingImage = null;
    preview.style.display = "none";
  }

  attachBtn.onclick = function(){ if (!busy && !done) fileInput.click(); };

  fileInput.onchange = function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (!/^image\/(png|jpeg|jpg|webp|gif)$/.test(f.type)){
      notice("err", "対応していない画像形式です（png・jpeg・webp・gif）。");
      return;
    }
    if (f.size > IMAGE_MAX_BYTES){
      notice("err", "画像が大きすぎます。9MB以下の画像をお使いください。");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = String(reader.result || "");
      var comma = dataUrl.indexOf(",");
      pendingImage = {
        mime: f.type,
        data: comma >= 0 ? dataUrl.slice(comma + 1) : "",
        dataUrl: dataUrl,
        name: f.name
      };
      previewImg.src = dataUrl;
      previewName.textContent = f.name;
      preview.style.display = "flex";
    };
    reader.onerror = function(){ notice("err", "画像を読み込めませんでした。"); };
    reader.readAsDataURL(f);
  };

  previewRemove.onclick = function(){ clearAttachment(); };

  function hint(text){
    if (!text) return;
    var d = document.createElement("div");
    d.className = "hint"; d.textContent = text;
    log.appendChild(d); scroll();
  }

  function notice(cls, text){
    var d = document.createElement("div");
    d.className = cls; d.textContent = text;
    log.appendChild(d); scroll();
  }

  function thinking(on){
    var old = document.getElementById("dots");
    if (old) old.remove();
    if (!on){
      setSprite("idle");
      if (mascot) mascot.classList.remove("thinking");   // 「？」を消す
      return;
    }
    // 腕を上げる「待機」ポーズは不自然だったのでやめ、考え込むポーズ
    // （review）に「？」を添えて「考え中」を表す
    setSprite("review");
    if (mascot) mascot.classList.add("thinking");   // 「？」を出す
    var r = document.createElement("div");
    r.className = "row ai"; r.id = "dots";
    r.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
    log.appendChild(r); scroll();
  }

  function clearChips(){
    var c = document.getElementById("chips");
    if (c) c.remove();
    multi = [];
  }

  function chips(opts, type){
    clearChips();
    if (!opts || !opts.length) return;
    var box = document.createElement("div");
    box.className = "chips"; box.id = "chips";

    // 選択肢を出していても入力欄は常に生きている。それが伝わらないと、
    // 選択肢に無いことを言いたい人が黙って離脱する
    var cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = type === "multi"
      ? "当てはまるものをすべて選んでください（下に自由に書いても構いません）"
      : "選んでも、下に自由に書いても構いません";
    box.appendChild(cap);

    opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "chip"; b.textContent = o; b.type = "button";
      b.onclick = function(){
        if (busy) return;
        if (type === "multi"){
          var at = multi.indexOf(o);
          if (at >= 0) multi.splice(at, 1); else multi.push(o);
          b.classList.toggle("on");
        } else {
          submit(o);
        }
      };
      box.appendChild(b);
    });

    if (type === "multi"){
      var go = document.createElement("button");
      go.className = "chip go"; go.type = "button"; go.textContent = "これで決定";
      go.onclick = function(){
        if (busy) return;
        submit(multi.length ? multi.join("、") : "特にありません");
      };
      box.appendChild(go);
    }

    var sk = document.createElement("button");
    sk.className = "chip sk"; sk.type = "button"; sk.textContent = "わからない・未定";
    sk.onclick = function(){ if (!busy) submit("わからない"); };
    box.appendChild(sk);

    log.appendChild(box); scroll();
  }

  // 「本当にここで終わりますか」の確認。通常の chips() とは別にする。
  // 「わからない・未定」チップが混ざると、この場面では意味が通らないため
  function exitChips(){
    clearChips();
    var box = document.createElement("div");
    box.className = "chips"; box.id = "chips";
    var mk = function(label, primary, action){
      var b = document.createElement("button");
      b.className = "chip" + (primary ? " primary" : "");
      b.textContent = label; b.type = "button";
      b.onclick = function(){ if (!busy) submit(label, action); };
      return b;
    };
    box.appendChild(mk("続けます", true));
    box.appendChild(mk("ここで終了します", false, "exit_confirm"));
    log.appendChild(box); scroll();
  }

  // 残り問数に応じた声かけ。数字だけより、気持ちが動くようにする
  // （2026-08-05 ユーザー指示。「あとこれくらい！」と伝えてやる気を保たせたい）
  function mascotMessage(n){
    if (!(n > 0)) return "";
    if (n === 1) return "あと1問です。もうすぐ終わります！";
    if (n <= 3) return "あと" + n + "問。ゴールはすぐそこです！";
    if (n <= 6) return "あと" + n + "問ほど。順調に進んでいます！";
    return "あと" + n + "問ほどです。気楽に答えてくださいね。";
  }

  function render(d){
    thinking(false);
    if (d.reply) bubble("ai", d.reply);
    hint(d.hint);
    if (typeof d.progress === "number") pg.style.width = Math.round(d.progress * 100) + "%";
    // メール照合が済むまでは「終了する」を出さない。押しても
    // メールアドレスの再入力を促されるだけで、意味が通らないため
    exitlink.style.display = d.stage === "gate" ? "none" : "";
    // ロボットの声かけも同じ理由でメール照合中は隠す（項目数がまだ意味を持たない）
    var msg = d.stage !== "gate" ? mascotMessage(d.turnsLeft) : "";
    if (msg){
      mascotText.textContent = msg; mascot.style.display = "flex"; placeMascot();
      mascot.classList.add("show-bubble");   // 質問が来たら、スマホでも吹き出しを見せる
      // スマホでは出しっぱなしにせず、数秒で自動的に閉じる（送信時はさらに早く閉じる）
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(function(){ mascot.classList.remove("show-bubble"); }, 4500);
      // 確認ターン（はい／違うのボタン）は見直しているポーズ。最初の質問だけ
      // 「こんにちは」と手を振り（以降の手振りは待機中のアイドルブレイクに
      // 任せる）、2回目以降の質問は落ち着いてidleに戻しつつ、直前の回答への
      // お礼として一礼する
      if (d.options && d.options.indexOf("はい、合っています") !== -1){
        setSprite("review");
      } else if (!greeted){
        greeted = true;
        setSprite("waving");
      } else {
        setSprite("idle");
        playBow();
      }
    }
    else mascot.style.display = "none";
    if (d.done){
      done = true;
      clearChips();
      notice("end", d.closing || "ありがとうございました。担当者よりご連絡いたします。");
      ta.disabled = true; send.disabled = true; attachBtn.disabled = true; exitlink.style.display = "none";
      // 完了してもマスコットは隠さず、労いの一言に差し替えて表示し続ける
      mascotText.textContent = "お疲れさまでした！ご回答ありがとうございました。";
      mascot.style.display = "flex";
      mascot.classList.add("show-bubble");   // スマホでもタップ無しでお礼が見えるように
      clearTimeout(bubbleTimer);   // お礼の吹き出しは自動で閉じない
      placeMascot();
      setSprite("jumping");   // 完了を喜ぶジャンプ（ワンショット→自動でidleへ）
      clearAttachment();
      ta.placeholder = "ヒアリングは完了しました";
      try { localStorage.removeItem("hearing_token"); } catch(e){}
      return;
    }
    if (d.type === "exit_confirm"){ exitChips(); return; }
    chips(d.options, d.type);
  }

  function post(path, body){
    return fetch(API + path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(j){
        if (!r.ok) throw new Error(j.error || ("通信に失敗しました（" + r.status + "）"));
        return j;
      });
    });
  }

  function submit(text, action){
    text = String(text || "").trim();
    var img = pendingImage;
    if ((!text && !img) || busy || done) return;
    if (mascot) mascot.classList.remove("show-bubble");   // 送信した瞬間、スマホの吹き出しは閉じる
    clearTimeout(bubbleTimer);
    busy = true; send.disabled = true; attachBtn.disabled = true;
    clearChips();
    bubble("me", text || "（画像を送信）", img ? img.dataUrl : null);
    ta.value = ""; ta.style.height = "auto";
    clearAttachment();
    thinking(true);
    post("/api/message", {
      token: token, text: text, action: action,
      image: img ? { data: img.data, mime: img.mime } : undefined
    })
      .then(render)
      .catch(function(e){
        thinking(false);
        setSprite("failed");   // 通信に失敗したことが伝わるポーズ（ワンショット→自動でidleへ）
        notice("err", e.message + "\nお手数ですが、もう一度送信してください。");
      })
      .then(function(){ busy = false; send.disabled = done; attachBtn.disabled = done; if (!done) ta.focus(); });
  }

  send.onclick = function(){ submit(ta.value); };
  // 常設の終了リンク。いつでも押せる（即終了はしない。まず警告と確認を挟む）
  exitlink.onclick = function(){
    if (busy || done || !token) return;
    submit("ここで終了する", "exit_request");
  };
  ta.addEventListener("input", function(){
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 130) + "px";
    placeMascot();   // 入力欄が伸びるとフッターも伸びるので、マスコットも押し上げる
  });
  ta.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault(); submit(ta.value);
    }
  });

  placeMascot();   // 初期表示時点の位置を確定しておく（表示は render() 側で切り替える）

  // 途中で閉じても続きから再開できるようにする
  var saved = null;
  try { saved = localStorage.getItem("hearing_token"); } catch(e){}
  thinking(true);
  post("/api/start", { token: saved, ref: QS })
    .then(function(d){
      token = d.token;
      try { localStorage.setItem("hearing_token", token); } catch(e){}
      (d.history || []).forEach(function(h){ bubble(h.role === "user" ? "me" : "ai", h.content); });
      render(d);
    })
    .catch(function(e){
      thinking(false);
      notice("err", "開始できませんでした：" + e.message);
    });
})();
</script>
</body>
</html>
